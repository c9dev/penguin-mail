[package]
name = "mailrs-discover"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Ships `fake::FakeNet`, the network held in memory, to other crates.
# Discovery's own tests always have it.
fake = []

[dependencies]
psl.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# `start_paused` lets a test watch a step run out its time limit without
# waiting for it.
tokio = { workspace = true, features = ["test-util"] }
