  "fastmail.co.uk", "fastmail.de", "fastmail.es", "fastmail.fr",
  "fastmail.in", "fastmail.jp", "fastmail.mx", "fastmail.net", "fastmail.nl",
  "fastmail.org", "fastmail.se", "fastmail.to", "fastmail.us", "123mail.org",
  "150mail.com", "150ml.com", "16mail.com", "2-mail.com", "4email.net",
  "50mail.com", "airpost.net", "aliencamel.com", "allmail.net",
  "bestmail.us", "cluemail.com", "elitemail.org", "emailcorner.net",
  "emailengine.net", "emailengine.org", "emailgroups.net", "emailplus.org",
  "emailuser.net", "eml.cc", "f-m.fm", "fast-email.com", "fast-mail.org",
  "fastem.com", "fastemail.us", "fastemailer.com", "fastest.cc",
  "fastimap.com", "fastmailbox.net", "fastmessaging.com", "fmail.co.uk",
  "fmailbox.com", "fmgirl.com", "fmguy.com", "foobox.com", "foobox.net",
  "ftml.net", "h-mail.us", "hailmail.net", "imap-mail.com", "imap.cc",
  "imapmail.org", "immerbox.com", "immermail.com", "inoutbox.com",
  "internet-e-mail.com", "internet-mail.org", "internetemails.net",
  "internetmailing.net", "jetemail.net", "justemail.net", "letterboxes.org",
  "lifetimeaddress.com", "mail-central.com", "mail-page.com", "mailas.com",
  "mailbolt.com", "mailc.net", "mailcan.com", "mailforce.net",
  "mailhaven.com", "mailingaddress.org", "mailite.com", "mailmight.com",
  "mailnew.com", "mailsent.net", "mailup.net", "mailworks.org",
  "mailzone.com", "ml1.net", "myfastmail.com", "mymacmail.com",
  "nospammail.net", "onepost.net", "ownmail.net", "penguinmail.com",
  "permanentmail.com", "petml.com", "pobox.com", "postinbox.com",
  "postpro.net", "proinbox.com", "promessage.com", "realemail.net",
  "reallyfast.biz", "reallyfast.info", "rushpost.com", "sent.at", "sent.com",
