# Penguin Mail's built-in provider table. Discovery reads it first, by the
# exact domain of the address, and then matches the domain's MX hosts
# against the `mx` patterns, so neither step sends anything to anyone.
#
# Checked on 2026-09-24 against each provider's own help pages, its own
# autoconfig file, and its DNS. A domain appears here when the provider's
# own page or file names it, or when its MX record pointed at the
# provider's mail exchangers on that day. Nothing here is copied from
# Mozilla's ISPDB.
#
# Fields:
# - kind: "imap" (servers below), "no_imap" (the provider serves no IMAP),
#   "not_yet" (the app cannot reach it yet), "google" (the Google sign-in
#   serves it), "microsoft" (a later version serves it).
# - mx: a host name, or "*.suffix" for any host under that suffix. An exact
#   host wins over every pattern, and a longer suffix over a shorter one.
# - imap, smtp: security "tls" is TLS from the first byte, "start_tls" a
#   plain connection upgraded by command. user_name "address" is the whole
#   address, "local_part_first" the part before @ and then the whole
#   address. smtp lists the servers in the order to try them.
# - custom_domain_imap, custom_domain_smtp: servers for a custom domain
#   found by MX, where they differ from those for the provider's own
#   domains.
# - password: "app_password" always, "account_password", or
#   "app_password_with_two_step" (the account password until two-step
#   sign-in is on).
# - files_sent_mail: whether the server files a copy of what SMTP sends in
#   Sent by itself. True only where a source says so, cited on the entry.
#   Where no source says, the entry says false and the app files the copy:
#   a duplicate in Sent costs less than a sent message missing from it.

