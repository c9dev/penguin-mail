[[provider]]
id = "icloud"
name = "iCloud Mail"
kind = "imap"
domains = ["icloud.com", "me.com", "mac.com"]
mx = ["mx01.mail.icloud.com", "mx02.mail.icloud.com"]
# Apple's page: the IMAP user name is the part before @, or the whole
# address if that fails. Port 465 does not answer.
imap = { host = "imap.mail.me.com", port = 993, security = "tls", user_name = "local_part_first" }
smtp = [
  { host = "smtp.mail.me.com", port = 587, security = "start_tls", user_name = "address" },
]
# A custom domain found by MX signs in with the whole address alone. Its
# local part at Apple could be a stranger's iCloud name, and the first
# attempt would send the password there.
custom_domain_imap = { host = "imap.mail.me.com", port = 993, security = "tls", user_name = "address" }
custom_domain_smtp = [
  { host = "smtp.mail.me.com", port = 587, security = "start_tls", user_name = "address" },
]
password = "app_password"
app_password_url = "https://support.apple.com/en-us/102654"
documentation_url = "https://support.apple.com/en-us/102525"
# Apple's server settings page (support.apple.com/en-us/102525) does not
# say whether smtp.mail.me.com files a copy in Sent.
files_sent_mail = false

