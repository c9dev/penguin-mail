# Builds Penguin Mail as a Flatpak from this checkout:
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.c9dev.penguin-mail.yml
# Flathub builds from a released tag instead; scripts/flatpak-sources.sh
# --flathub writes that copy of this file. Flathub allows no network during
# a build, so cargo reads every crate from cargo-sources.json, which the
# same script writes from Cargo.lock.
id: io.github.c9dev.penguin-mail
runtime: org.gnome.Platform
# GNOME 51 has GTK 4.24, past the 4.20 the app needs, libadwaita 1.10,
# past 1.8, and WebKitGTK 6.0. Flathub asks a new submission for the
# latest GNOME runtime.
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: penguin-mail
# Past the window and the network, the sandbox lets the app reach two
# D-Bus services (the tray's watcher and notifications) and three places
# on disk (Downloads, ~/.gnupg, and gpg-agent's socket folder). Each is
# explained where it is granted. Secrets go through the Secret portal
# instead of a D-Bus service, so they need no finish-arg of their own: a
# portal is always reachable, and this one gives the app its own
# encrypted store rather than the run of the whole unlocked Secret
# Service every other app can also reach. gmail/src/secret_portal.rs is
# the app's side of it.
finish-args:
  # Gmail, Google Calendar and People, and the assistant's model.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Saved attachments and exports land in Downloads; everything else goes
  # through the file chooser portal.
  - --filesystem=xdg-download
  # OpenPGP and S/MIME run the runtime's gpg and gpgsm on the person's
  # own keyring in ~/.gnupg. Reading signed mail needs it writable:
  # verifying an S/MIME signature has gpgsm file away every certificate
  # the signature carries, with no option to turn that off, and Penguin
  # Mail relies on it to decide later which certificate an address's
  # mail should encrypt to. OpenPGP verification asks for no such write
  # (mailrs_pgp turns off gpg's own auto-import), but the two engines
  # share this one keyring.
  - --filesystem=~/.gnupg
  # gpg-agent's socket folder, read-only, so gpg reaches the person's own
  # agent and the desktop's pinentry asks for passphrases, instead of
  # starting a second agent inside the sandbox.
  - --filesystem=xdg-run/gnupg:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/penguin-mail/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: penguin-mail
    buildsystem: simple
    build-options:
      env:
        # Empty here. scripts/flatpak-sources.sh --flathub writes the
        # project's Google and Microsoft clients into the copy for Flathub,
        # which builds on its own servers and cannot read GitHub's secrets.
        # A build from this file says it cannot sign in to Google or
        # Microsoft, where a stand-in value would send people to a sign-in
        # Google refuses.
        PENGUIN_MAIL_GOOGLE_CLIENT_ID: ""
        PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ""
        PENGUIN_MAIL_MICROSOFT_CLIENT_ID: ""
    build-commands:
      - cargo --offline build --release --locked -p mailrs -p mailrs-cli
        --features mailrs/packaging-flatpak,mailrs-cli/packaging-flatpak
      - scripts/stage.sh /app io.github.c9dev.penguin-mail
    sources:
      - cargo-sources.json
      - type: dir
        path: ../..
        skip:
          - target
          - build-dir
          - .flatpak-builder
