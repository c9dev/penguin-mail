<!doctype html>
<!--
  A page that asks which address to take off the list before it does
  anything. The matching email_confirm.json is what extract.js reads off
  this page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leave Example Weekly</title>
  </head>
  <body>
    <h1>Leave Example Weekly</h1>
    <p>Type the address you receive this newsletter at and confirm.</p>
    <form method="post" action="/leave">
      <label for="address">Email address</label>
      <input type="email" id="address" name="address" required />
      <input type="hidden" name="campaign" value="c41f" required />
      <button type="submit">Confirm</button>
    </form>
  </body>
</html>
