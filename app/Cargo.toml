[package]
name = "mailrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Gmail client for the GNOME desktop"

[[bin]]
name = "penguin-mail"
path = "src/main.rs"

[dependencies]
mailrs-domain.workspace = true
mailrs-gmail.workspace = true
mailrs-store.workspace = true
# `--demo` runs on sync's in-memory Gmail, so the app asks for it.
mailrs-sync = { workspace = true, features = ["fake"] }
mailrs-ai.workspace = true
mailrs-pgp.workspace = true
adw.workspace = true
ammonia.workspace = true
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
gtk.workspace = true
ksni.workspace = true
mail-builder.workspace = true
# The message inside an encrypted one arrives as MIME, not through Gmail.
mail-parser.workspace = true
notify-rust.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
spellbook.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webkit.workspace = true

[dev-dependencies]
mail-parser.workspace = true
tempfile.workspace = true
