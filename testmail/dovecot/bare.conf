# The Bare profile: no CONDSTORE, QRESYNC, MOVE or SPECIAL-USE, and no
# Archive mailbox. A client compares flags and UIDs itself, moves by COPY,
# STORE and UID EXPUNGE, knows Sent, Drafts, Trash and Junk by name, and
# makes Archive the first time it archives.
#
# Dovecot still answers LIST with the special-use flags its defaults set,
# even without the capability, so this clears them.

# Room for a test's two clients at once. The client keeps to 3 itself.
mail_max_userip_connections = 20

imap_capability {
  QRESYNC = no
  CONDSTORE = no
  MOVE = no
  SPECIAL-USE = no
}

namespace inbox {
  mailbox Drafts {
    special_use =
  }
  mailbox Junk {
    special_use =
  }
  mailbox Sent {
    special_use =
  }
  mailbox Trash {
    special_use =
  }
}
