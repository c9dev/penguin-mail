# The NoQresync profile: CONDSTORE without QRESYNC, so a client reads
# flag changes by MODSEQ and finds deletions by comparing UIDs.

# Room for a test's two clients at once. The client keeps to 3 itself.
mail_max_userip_connections = 20

imap_capability {
  QRESYNC = no
}

namespace inbox {
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}
