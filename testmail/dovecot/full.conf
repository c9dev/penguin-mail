# The Full profile: every extension Dovecot 2.4.5 offers, and an Archive
# mailbox with its SPECIAL-USE flag, which the image's defaults lack.

# Room for a test's two clients at once. The client keeps to 3 itself.
mail_max_userip_connections = 20

# POP3 for the POP3 client and downloader tests: STLS on 31110 and TLS
# from the first byte on 31995.
protocols {
  pop3 = yes
}

namespace inbox {
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}
