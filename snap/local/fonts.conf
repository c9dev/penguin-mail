<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig's main file inside the snap. snapcraft.yaml stages it as
  $SNAP/etc/fonts/penguin-mail.conf and snap/local/launcher points
  FONTCONFIG_FILE at it.

  Without it, the snap's fontconfig reads the host's /etc/fonts/fonts.conf.
  The host's conf.d entries link to /usr/share/fontconfig/conf.avail, and
  inside the snap /usr is the core26 base, which holds one of those files.
  No rule then says which font "sans-serif" means, and fontconfig picks
  whatever scores best: on one Pop!_OS 24.04 desktop, a Chinese font with
  fixed-width Latin letters.
-->
<fontconfig>
	<!-- The desktop interface mounts the host's font folders here. -->
	<dir>/usr/share/fonts</dir>
	<dir>/usr/local/share/fonts</dir>
	<!-- The snap's own DejaVu, relative to this file's folder. -->
	<dir prefix="relative">../../usr/share/fonts</dir>

	<!-- The same generic names fontconfig's stock fonts.conf maps. -->
	<match target="pattern">
		<test qual="any" name="family"><string>mono</string></test>
		<edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans serif</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>sans</string></test>
		<edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family"><string>system ui</string></test>
		<edit name="family" mode="assign" binding="same"><string>system-ui</string></edit>
	</match>

	<!--
	  The snap's conf.d, found through FONTCONFIG_PATH. Its links are
	  relative, so they reach the rules in $SNAP/usr/share/fontconfig.
	  Its 50-user.conf reads the file the launcher writes, which names the
	  person's own font folders and a cache folder the snap can write.
	-->
	<include ignore_missing="yes">conf.d</include>

	<!-- The host's cache, read only, saves a scan of the system fonts. -->
	<cachedir>/var/cache/fontconfig</cachedir>
</fontconfig>
