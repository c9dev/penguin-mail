[workspace]
resolver = "3"
members = ["domain", "gmail"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
mailrs-domain = { path = "domain" }
mailrs-gmail = { path = "gmail" }
mailrs-store = { path = "store" }
mailrs-sync = { path = "sync" }

anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
encoding_rs = "0.8.41"
futures = "0.3.34"
keyring = "4.2.0"
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wiremock = "0.6.5"
