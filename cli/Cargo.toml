[package]
name = "mailrs-cli"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "penguin-mail-cli"
path = "src/main.rs"

[features]
# Reaches secrets through the Secret portal instead of the desktop
# keyring; the Flatpak build turns this on, since `penguin-mail-cli`
# ships inside it beside `penguin-mail`.
packaging-flatpak = ["mailrs-gmail/packaging-flatpak", "mailrs-sync/packaging-flatpak"]

[dependencies]
mailrs-domain.workspace = true
mailrs-gmail.workspace = true
mailrs-imap.workspace = true
mailrs-store.workspace = true
mailrs-sync.workspace = true
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
