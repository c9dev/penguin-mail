[package]
name = "mailrs-dav"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Ships `fake::FakeDav`, a CalDAV and CardDAV server held in memory, to
# other crates. The crate's own tests always have it.
fake = []

[dependencies]
mailrs-domain.workspace = true
base64.workspace = true
calcard.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
# Says whether a redirect stays with the context URL's registrable
# domain, the one place the account's password may go.
psl.workspace = true
rand.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
mailrs-testmail.workspace = true
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
