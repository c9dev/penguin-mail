name: Nix

# CI calls this for every code change, so its verdict, which a release
# waits for, includes the flake.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux package and development shell
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Nix files are formatted
        run: nix fmt -- --fail-on-change
      - name: Evaluate both Linux architectures
        run: nix flake check --no-build --all-systems
      - name: Build the package and check both executables
        run: nix flake check --print-build-logs --max-jobs 2 --cores 2
      - name: Check the development shell
        run: |
          nix develop --command bash -euc '
            rustc --version
            cargo --version
            pkg-config --atleast-version=4.20 gtk4
            pkg-config --atleast-version=1.8 libadwaita-1
            pkg-config --atleast-version=2.50 webkitgtk-6.0
          '
      - name: Allow user namespaces for sandbox tests
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check skill scripts with the Nix runtime
        run: nix develop --command env PENGUIN_MAIL_REQUIRE_SANDBOX=1 cargo test -p mailrs --bin penguin-mail assistant::sources::skills::tests
