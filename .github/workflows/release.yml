name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # A trial run from the Actions tab builds the packages and keeps them as a
  # workflow artifact. It publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the packages
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PENGUIN_MAIL_REQUIRE_CRYPTO: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: scripts/ci-deps.sh
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Read the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Translation template is current
        run: scripts/update-po.sh --check
      - name: Build
        run: cargo build --release -p mailrs -p mailrs-cli
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/stage.sh tree
          scripts/package.sh tree "$VERSION" dist
      - name: Take out the changelog section
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/changelog.sh section "$VERSION" > dist/notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penguin-mail-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  rpm:
    name: Build the rpm
    needs: build
    runs-on: ubuntu-latest
    # The oldest Fedora with GTK 4.20 and libadwaita 1.8. rpm requires the
    # libraries the binaries link against, so an rpm built here installs on
    # this release and the ones after it.
    container: fedora:43
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Install git
        run: dnf install -y git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: scripts/ci-deps.sh
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release -p mailrs -p mailrs-cli
      # The apt repository's key signs the rpm too. A release must go out
      # signed, since the .repo file it installs turns on gpgcheck; a trial
      # run without the secret builds an unsigned rpm and says so.
      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            if [ "$REF_TYPE" = tag ]; then
              echo "::error::APT_SIGNING_KEY is not set, and a released rpm must be signed"
              exit 1
            fi
            echo "::warning::APT_SIGNING_KEY is not set; the rpm is unsigned"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          echo "RPM_SIGN_KEY=FE3C3B6E699AF939DC4670DCF3A853035C3E2B8E" >> "$GITHUB_ENV"
      - name: Pack
        run: |
          scripts/stage.sh tree
          scripts/package-rpm.sh tree "$VERSION" dist
      # Installs the rpm the way a person would and starts it on a virtual
      # display, which catches a library the rpm forgot to require.
      - name: Install and start it
        run: |
          if [ -n "${RPM_SIGN_KEY:-}" ]; then
            rpm --import packaging/apt/penguin-mail-archive-keyring.asc
            rpm -K "dist/penguin-mail-$VERSION-1.x86_64.rpm"
          fi
          dnf install -y "./dist/penguin-mail-$VERSION-1.x86_64.rpm"
          penguin-mail --version
          scripts/smoke-start.sh /usr/bin/penguin-mail
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penguin-mail-${{ needs.build.outputs.version }}-rpm
          path: dist/*.rpm
          if-no-files-found: error

  appimage:
    name: Build the AppImage
    needs: build
    runs-on: ubuntu-latest
    # An AppImage runs on the glibc it was built against and newer ones.
    # Ubuntu 26.04 is the oldest release carrying GTK 4.20, libadwaita 1.8
    # and WebKitGTK 6.0 to build against, so it sets that floor.
    container: ubuntu:26.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          scripts/ci-deps.sh
          apt-get install -y --no-install-recommends patchelf libglib2.0-bin \
              libgdk-pixbuf2.0-bin librsvg2-common glib-networking adwaita-icon-theme \
              ibus-gtk4
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release -p mailrs -p mailrs-cli --features mailrs/packaging-appimage
      - name: Pack
        run: |
          scripts/stage.sh tree
          scripts/package-appimage.sh tree "$VERSION" dist
      # A container has no FUSE, so the AppImage unpacks itself and runs.
      - name: Start it
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: scripts/smoke-start.sh "dist/penguin-mail-$VERSION-x86_64.AppImage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: penguin-mail-${{ needs.build.outputs.version }}-appimage
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error

  snap:
    name: Build the snap
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Set once the snap name is registered; see the last step.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds in an LXD container, from snap/snapcraft.yaml.
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft
      - name: Install and start it
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: |
          sudo snap install core26 mesa-2604
          sudo snap install --dangerous "$SNAP_FILE"
          scripts/smoke-start.sh snap run penguin-mail
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snap-${{ needs.build.outputs.version }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
      # Every tag goes to the edge channel; stable is a promotion by hand
      # in the Snap Store until the snap has proven itself. Without the
      # credential, which exists only once the owner has registered the
      # name, the snap is built and tested and goes nowhere.
      - name: Publish to edge
        if: github.ref_type == 'tag' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: edge

  publish:
    name: Publish the release
    needs: [build, rpm, appimage]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: penguin-mail-${{ needs.build.outputs.version }}*
          merge-multiple: true
          path: dist
      # Each package comes from its own job, so the sums are written once
      # every file is in one place. The updater checks its download here.
      - name: Write the checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum *.deb *.rpm *.AppImage *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Penguin Mail ${{ needs.build.outputs.version }}
          body_path: dist/notes.md
          make_latest: "true"
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
