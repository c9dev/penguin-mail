name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # A trial run from the Actions tab builds the packages and keeps them as a
  # workflow artifact. It publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

# One release at a time per tag or branch, and a running one is never
# cancelled half-published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The packages build from a commit main's CI has already tested, since
  # scripts/release.sh tags only on main and runs the gate first. Rather
  # than test it a second time, this job waits for CI's verdict on the same
  # commit while the packages build, and nothing publishes without a pass.
  # CI starts from the same push as the tag, so its run may still be going.
  # A later push to main cancels it, which counts as no pass: re-run CI on
  # the commit, then this workflow's failed jobs.
  ci:
    name: CI passed on this commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # CI's longest path is the AppImage: up to 90 minutes to build and 20
    # to test.
    timeout-minutes: 125
    permissions:
      actions: read # reads CI's runs on this commit
    steps:
      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 240); do
            # A failed call is asked again on the next round.
            states=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50" \
                --jq '.workflow_runs[] | "\(.status) \(.conclusion)"') || states=
            if grep -qx 'completed success' <<<"$states"; then
              echo "CI passed on $SHA."
              exit 0
            fi
            if [ -n "$states" ] && ! grep -qv '^completed ' <<<"$states"; then
              echo "::error::CI did not pass on $SHA: $(sort -u <<<"$states" | paste -sd, -)"
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI on $SHA had not finished after 120 minutes"
          exit 1

  # The package jobs build without the Actions cache. Another run wrote
  # whatever a cache holds, and a poisoned entry would go out inside a
  # signed release.
  build:
    name: Build the packages
    needs: version
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: scripts/ci-deps.sh
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The project's Google and Microsoft clients go into the binaries at
      # compile time. A run without the secrets builds a copy that cannot
      # add a Google account, and says so when someone tries.
      - name: Build
        env:
          PENGUIN_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_ID }}
          PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_SECRET }}
          PENGUIN_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: cargo build --release -p mailrs -p mailrs-cli
      - name: Pack
        run: |
          scripts/stage.sh tree
          scripts/package.sh tree "$VERSION" dist
      - name: Take out the changelog section
        if: github.ref_type == 'tag'
        run: scripts/changelog.sh section "$VERSION" > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penguin-mail-${{ needs.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  appimage:
    name: Build and test the AppImage
    needs: version
    uses: ./.github/workflows/appimage.yml # zizmor: ignore[self-repository]
    secrets:
      PENGUIN_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_ID }}
      PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}

  rpm:
    name: Build the rpm
    needs: version
    runs-on: ubuntu-latest
    # The oldest Fedora with GTK 4.20 and libadwaita 1.8. rpm requires the
    # libraries the binaries link against, so an rpm built here installs on
    # this release and the ones after it.
    container: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install git
        run: dnf install -y git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: scripts/ci-deps.sh
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The build sees the OAuth clients it compiles in and nothing else:
      # no step that runs cargo, and so no build script or proc macro,
      # ever has the signing key in its environment.
      - name: Build and pack
        env:
          PENGUIN_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_ID }}
          PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_SECRET }}
          PENGUIN_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: scripts/package-rpm.sh "$VERSION" dist
      # The apt repository's key signs the rpm too. A pushed release must
      # go out signed, since the .repo file it installs turns on gpgcheck;
      # a trial run without the secret keeps the rpm unsigned and says so.
      # The private key lives in a keyring of its own for this step only
      # and is gone before the next step starts the app.
      - name: Sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::APT_SIGNING_KEY is not set, and a released rpm must be signed"
              exit 1
            fi
            echo "::warning::APT_SIGNING_KEY is not set; the rpm is unsigned"
            exit 0
          fi
          signing=$(mktemp -d)
          trap 'gpgconf --homedir "$signing" --kill all; rm -rf "$signing"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | GNUPGHOME=$signing gpg --batch --import
          GNUPGHOME=$signing rpmsign --addsign \
              --define "_gpg_name FE3C3B6E699AF939DC4670DCF3A853035C3E2B8E" \
              --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase ''" \
              "dist/penguin-mail-$VERSION-1.x86_64.rpm" >/dev/null
          echo "RPM_SIGNED=1" >> "$GITHUB_ENV"
      # Installs the rpm the way a person would and starts it on a virtual
      # display, which catches a library the rpm forgot to require.
      - name: Install and start it
        run: |
          if [ "${RPM_SIGNED:-}" = 1 ]; then
            rpm --import packaging/apt/penguin-mail-archive-keyring.asc
            rpm -K "dist/penguin-mail-$VERSION-1.x86_64.rpm"
          fi
          dnf install -y "./dist/penguin-mail-$VERSION-1.x86_64.rpm"
          penguin-mail --version
          scripts/smoke-start.sh /usr/bin/penguin-mail
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penguin-mail-${{ needs.version.outputs.version }}-rpm
          path: dist/*.rpm
          if-no-files-found: error

  arch:
    name: Build the Arch package
    needs: version
    runs-on: ubuntu-latest
    # Arch has no numbered releases to pin to the way Fedora does: pacman
    # and the libraries it installs move together, so "latest" is the same
    # container as building on an up-to-date Arch install. The digest pins
    # the starting image, and the job's first step brings it up to date
    # with pacman -Syu.
    container: archlinux:latest@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: scripts/ci-deps.sh
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and pack
        env:
          PENGUIN_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_ID }}
          PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_SECRET }}
          PENGUIN_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: scripts/package-arch.sh "$VERSION" dist
      # Installs the package the way a person would and starts it on a
      # virtual display, which catches a Depends the PKGBUILD forgot.
      - name: Install and start it
        run: |
          pacman -U --noconfirm "dist/penguin-mail-$VERSION-1-x86_64.pkg.tar.zst"
          penguin-mail --version
          scripts/smoke-start.sh /usr/bin/penguin-mail
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penguin-mail-${{ needs.version.outputs.version }}-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  flatpak:
    name: Build the Flatpak
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checked-in manifest leaves these empty. A tagged release must
      # include the Google client, just as the .deb and rpm do.
      - name: Put the Google and Microsoft clients into the manifest
        env:
          EVENT: ${{ github.event_name }}
          PENGUIN_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_ID }}
          PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_SECRET }}
          PENGUIN_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          names = (
              "PENGUIN_MAIL_GOOGLE_CLIENT_ID",
              "PENGUIN_MAIL_GOOGLE_CLIENT_SECRET",
              "PENGUIN_MAIL_MICROSOFT_CLIENT_ID",
          )
          if os.environ["EVENT"] == "push" and any(not os.environ[name] for name in names[:2]):
              raise SystemExit("A released Flatpak needs the Google client ID and secret")
          path = Path("packaging/flatpak/io.github.c9dev.penguin-mail.yml")
          recipe = path.read_text(encoding="utf-8")
          for name in names:
              empty = f'{name}: ""'
              if recipe.count(empty) != 1:
                  raise SystemExit(f"{path} has no single empty {name}")
              recipe = recipe.replace(empty, f"{name}: {json.dumps(os.environ[name])}")
          path.write_text(recipe, encoding="utf-8")
          PY
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: penguin-mail.flatpak
          manifest-path: packaging/flatpak/io.github.c9dev.penguin-mail.yml
          branch: stable
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false
      - name: Name the release bundle
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(*.flatpak)
          if [ ${#bundles[@]} -ne 1 ]; then
              echo "::error::Expected one Flatpak bundle, found ${#bundles[@]}"
              exit 1
          fi
          mkdir -p dist
          mv "${bundles[0]}" "dist/penguin-mail-$VERSION-x86_64.flatpak"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penguin-mail-${{ needs.version.outputs.version }}-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  snap:
    name: Build the snap
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The snap builds inside its own container, where these secrets do
      # not reach, so they go into the recipe it builds from. The recipe
      # in the repository keeps empty values. A run without the secrets,
      # such as one from a fork, leaves them empty, and that snap says it
      # cannot sign in to Google or Microsoft.
      - name: Put the Google and Microsoft clients into the recipe
        env:
          PENGUIN_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_ID }}
          PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_SECRET }}
          PENGUIN_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "snap/snapcraft.yaml"
          recipe = open(path).read()
          for name in ("PENGUIN_MAIL_GOOGLE_CLIENT_ID", "PENGUIN_MAIL_GOOGLE_CLIENT_SECRET", "PENGUIN_MAIL_MICROSOFT_CLIENT_ID"):
              empty = f'{name}: ""'
              if recipe.count(empty) != 1:
                  raise SystemExit(f"snap/snapcraft.yaml has no single empty {name}")
              # A JSON string is a YAML double-quoted string too.
              recipe = recipe.replace(empty, f"{name}: {json.dumps(os.environ[name])}")
          open(path, "w").write(recipe)
          PY
      # Builds in an LXD container, from snap/snapcraft.yaml.
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft
      # snap run puts the app in a systemd scope so snapd can track it.
      # The runner user has no systemd user instance, so as that user snap
      # run stops with "cannot track application process". As root, snapd
      # falls back to the system's systemd, and the confined app starts the
      # same way.
      - name: Install and start it
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: |
          sudo snap install core26 mesa-2604
          sudo snap install --dangerous "$SNAP_FILE"
          # The headless smoke test uses software rendering and cannot check GPU access.
          sudo snap run --shell penguin-mail -c 'snapctl is-connected opengl'
          sudo scripts/smoke-start.sh snap run penguin-mail
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-${{ needs.version.outputs.version }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  macos:
    name: Build the macOS apps
    # zizmor suggests the $/ form for a workflow in this repository. It
    # needs a runner from 2.336.0 on and has not been tried here, and a
    # call that fails would stop a release, so ./ stays.
    uses: ./.github/workflows/macos.yml # zizmor: ignore[self-repository]
    secrets:
      PENGUIN_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_ID }}
      PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  publish:
    name: Publish the release
    needs: [version, ci, build, appimage, rpm, arch, flatpak, macos]
    # Only a pushed tag publishes. A trial run from the Actions tab builds
    # everything and publishes nothing, whichever ref it ran on.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and uploads its files
    steps:
      # Only the public key, to check the signature below against the key
      # the app has compiled in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/apt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: penguin-mail-${{ needs.version.outputs.version }}*
          merge-multiple: true
          path: dist
      # Each package comes from its own job, so the sums are written once
      # every file is in one place. The updater checks its download against
      # them, and trusts them only with a good signature from the apt
      # repository's key, which it has compiled in; it refuses a release
      # without one. The private key lives in a keyring of its own for this
      # step only, as in the rpm job.
      - name: Write and sign the checksums
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::APT_SIGNING_KEY is not set, and the updater refuses unsigned checksums"
            exit 1
          fi
          cd dist
          rm -f SHA256SUMS SHA256SUMS.asc
          sha256sum -- *.deb *.rpm *.pkg.tar.zst *.tar.gz *.zip *.flatpak *.AppImage > SHA256SUMS
          cat SHA256SUMS
          signing=$(mktemp -d)
          trap 'gpgconf --homedir "$signing" --kill all; rm -rf "$signing"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | GNUPGHOME=$signing gpg --batch --import
          GNUPGHOME=$signing gpg --batch --yes --pinentry-mode loopback --passphrase '' \
              --local-user FE3C3B6E699AF939DC4670DCF3A853035C3E2B8E \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpgv --homedir "$signing" \
              --keyring "$GITHUB_WORKSPACE/packaging/apt/penguin-mail-archive-keyring.gpg" \
              SHA256SUMS.asc SHA256SUMS
      # A re-run after a failed upload finds the release already there,
      # and then replaces its files and notes rather than stopping.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s failglob
          files=(dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.tar.gz dist/*.zip \
              dist/*.flatpak dist/*.AppImage dist/SHA256SUMS dist/SHA256SUMS.asc)
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "Penguin Mail $VERSION" \
                  --notes-file dist/notes.md --latest
              gh release upload "$TAG" --clobber "${files[@]}"
              # A file the first run uploaded and this one did not build,
              # say under an old name, would stay downloadable beside the
              # new sums, so it goes.
              declare -A keep
              for file in "${files[@]}"; do keep[$(basename "$file")]=1; done
              gh release view "$TAG" --json assets --jq '.assets[].name' |
                  while IFS= read -r name; do
                      if [ -z "${keep[$name]:-}" ]; then
                          echo "Removing $name, which this run did not build"
                          gh release delete-asset "$TAG" "$name" --yes
                      fi
                  done
          else
              gh release create "$TAG" --verify-tag --title "Penguin Mail $VERSION" \
                  --notes-file dist/notes.md --latest "${files[@]}"
          fi

  # Every release goes to the snap's edge channel once the GitHub release
  # is out, so edge never carries a version whose other packages failed.
  # Stable is a promotion by hand in the Snap Store until the snap has
  # proven itself. Without the credential, which exists only once the
  # owner has registered the name, the snap is built and tested and goes
  # nowhere.
  snap-edge:
    name: Publish the snap to edge
    needs: [version, snap, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          name: snap-${{ needs.version.outputs.version }}
          path: snap-file
      - name: Find the snap
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        id: file
        run: echo "snap=$(ls snap-file/*.snap)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.file.outputs.snap }}
          release: edge
