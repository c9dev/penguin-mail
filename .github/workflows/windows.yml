name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows sandbox and platform regressions
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Install the GNU Rust toolchain and BusyBox
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          curl --fail --location --retry 3 https://frippery.org/files/busybox/busybox64u.exe -o busybox64u.exe
          echo '36b266923fc5765b42f5f981319f39568498fba60b53ccf26e8fc1e575e2a9a9  busybox64u.exe' | sha256sum --check
      - name: Exercise native Windows isolation, ownership and locale behavior
        shell: msys2 {0}
        env:
          PENGUIN_MAIL_REQUIRE_SANDBOX: '1'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          export PENGUIN_MAIL_BUSYBOX="$(cygpath -m "$PWD/busybox64u.exe")"
          export X86_64_PC_WINDOWS_GNU_MSYSTEM_PREFIX="$(cygpath -m /ucrt64)"
          export GETTEXT_SYSTEM=1
          for filter in sandbox::windows_tests sandbox::windows::tests locale_time::windows_tests web::owned_text::tests; do
            cargo +stable-x86_64-pc-windows-gnu test -p mailrs --bin penguin-mail "$filter" -- --test-threads=1
          done
      - name: Compile the installer and verify uninstall cleanup
        shell: pwsh
        run: scripts/test-windows-installer.ps1
