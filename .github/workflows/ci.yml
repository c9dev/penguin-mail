name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A weekly run of every job, whatever changed, catches drift in the
  # Docker images, the runners and the toolchain.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

# A newer push to a pull request replaces its older run. On main every push
# finishes, so a change a later push does not touch still gets its jobs.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the jobs below a change needs. A skipped job counts as
  # passed, so a run of skipped jobs concludes success, which is what the
  # release workflow's CI check reads.
  changes:
    name: Which jobs this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      imap: ${{ steps.paths.outputs.imap }}
      jmap: ${{ steps.paths.outputs.jmap }}
      packaging: ${{ steps.paths.outputs.packaging }}
      appimage: ${{ steps.paths.outputs.appimage }}
      macos: ${{ steps.paths.outputs.macos }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the changed files with each job's paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          full=false
          case "$EVENT" in
            workflow_dispatch|schedule) full=true ;;
          esac
          base=
          case "$EVENT" in
            push) base=$BEFORE ;;
            pull_request) base=$PR_BASE ;;
          esac
          # A new branch has an all-zero before, and a force push leaves one
          # the clone lacks. Either way, treat everything as changed.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            full=true
          fi
          if [ "$full" = true ]; then
            files=
          else
            files=$(git diff --name-only "$base" "$HEAD")
          fi
          # true when everything changed or a changed file matches the regex.
          any() {
            if [ "$full" = true ] || grep -Eq "$1" <<<"$files"; then echo true; else echo false; fi
          }
          if [ "$full" = true ] || grep -Evq '^(docs/|\.github/ISSUE_TEMPLATE/|LICENSE$)|\.md$' <<<"$files"; then
            code=true
          else
            code=false
          fi
          imap=$(any '^(imap|sync|testmail|pop3|sieve|dav|discover|mime|store|domain)/|^(Cargo\.lock|Cargo\.toml|scripts/test-images\.sh|\.github/workflows/ci\.yml)$')
          jmap=$(any '^(jmap|sync|testmail|discover)/|^(Cargo\.lock|Cargo\.toml|scripts/test-images\.sh|\.github/workflows/ci\.yml)$')
          packaging=$(any '^(packaging|snap|app/data)/|^(Cargo\.lock|Cargo\.toml)$|^scripts/flatpak|^scripts/[^/]*macos|^\.github/workflows/|(^|/)build\.rs$')
          # The AppImage bundles the app itself, so any change to it counts.
          appimage=$(any '^(app|packaging/appimage)/|^scripts/(appimage|test-appimage|stage)\.sh$|^(Cargo\.lock|Cargo\.toml)$|^\.github/workflows/(appimage|ci)\.yml$')
          # macOS-only sources: files under macos paths, and Rust files that
          # name target_os = "macos" (find them with a grep over *.rs).
          macos=true
          if [ "$packaging" = false ]; then
            macos=false
            if grep -Eq '^app/src/(web/macos/|app/dock_badge/macos\.rs$)|^app/tests/drive_macos\.rs$' <<<"$files"; then
              macos=true
            else
              while IFS= read -r f; do
                case "$f" in
                  *.rs) if [ -f "$f" ] && grep -q 'target_os = "macos"' "$f"; then macos=true; fi ;;
                esac
              done <<<"$files"
            fi
          fi
          {
            echo "code=$code"
            echo "imap=$imap"
            echo "jmap=$jmap"
            echo "packaging=$packaging"
            echo "appimage=$appimage"
            echo "macos=$macos"
            echo "full=$full"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  macos:
    name: macOS apps build and start
    needs: changes
    if: needs.changes.outputs.macos == 'true' || needs.changes.outputs.full == 'true'
    # Kept as ./ rather than zizmor's $/ form, as in release.yml.
    uses: ./.github/workflows/macos.yml # zizmor: ignore[self-repository]
    with:
      # Scheduled and manual runs build both. Everyday changes build the
      # Apple silicon app only.
      arches: ${{ needs.changes.outputs.full == 'true' && '["arm64","x86_64"]' || '["arm64"]' }}
    # Pull requests exercise packaging without the release credentials.

  nix:
    name: Nix package and development shell
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/nix.yml # zizmor: ignore[self-repository]

  appimage:
    name: AppImage builds and runs
    needs: changes
    if: needs.changes.outputs.appimage == 'true' || needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/appimage.yml # zizmor: ignore[self-repository]

  gate:
    name: Tests, clippy, translations, accessibility
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # GitHub's hosted runners stop short of the GTK, libadwaita and WebKitGTK
    # the app needs, so the gate runs on the release it targets. Each
    # container here and in release.yml is pinned by digest, so a changed
    # image under the same tag cannot slip in. To take a newer one, read its
    # digest with `docker buildx imagetools inspect <image>:<tag>`.
    container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # A build machine must not pass the crypto tests by skipping them.
      PENGUIN_MAIL_REQUIRE_CRYPTO: "1"
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: scripts/ci-deps.sh
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ubuntu-26.04
      # update-po.sh reads the Rust sources with xtr. The cache restored
      # above keeps ~/.cargo/bin, so cargo install usually finds it there
      # and has nothing to build.
      - name: Install xtr
        run: cargo install --locked xtr --version 0.1.11
      - name: Tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Translation template is current
        run: scripts/update-po.sh --check
      # --no-net skips fetching the screenshots, which live on main: a
      # branch that adds one would fail here until it merged.
      - name: Store listing and desktop entry are valid
        run: |
          appstreamcli validate --strict --no-net app/data/io.github.c9dev.PenguinMail.metainfo.xml
          desktop-file-validate app/data/io.github.c9dev.PenguinMail.desktop
          scripts/metainfo.sh --check
      - name: Every package build gets the Microsoft client id
        run: scripts/check-secrets.sh
      # The snap builds only when a release is tagged, and 1.0.1's failed
      # there because an edit dropped this file's executable bit.
      - name: The snap's launcher is executable
        run: test -x snap/local/launcher
      - name: The snap finds libproxy's backend
        run: python3 scripts/test-snap-launcher.py
      - name: Every control has an accessible name
        run: scripts/a11y-names.sh

  debian:
    name: Debian 13 build, package and start
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Debian 13 ships GTK 4.18 and libadwaita 1.7, which the app's default
    # features do not build against; this job keeps the older paths
    # compiling and the .deb installable there. Pinned by digest like the
    # gate's container.
    container: debian:13@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: scripts/ci-deps.sh
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debian-13
      - name: Clippy on the Debian build
        run: cargo clippy -p mailrs --no-default-features --features packaging-debian --all-targets -- -D warnings
      - name: Build and pack
        run: scripts/package-debian.sh dist
      # Installs the .deb the way a person would and starts it on a
      # virtual display, so a library it forgot to depend on shows here.
      - name: Install and start it
        run: |
          apt-get install -y ./dist/penguin-mail_*~deb13_amd64.deb
          penguin-mail --version
          scripts/smoke-start.sh /usr/bin/penguin-mail

  imap:
    name: IMAP and SMTP against real servers
    needs: changes
    if: needs.changes.outputs.imap == 'true' || needs.changes.outputs.full == 'true'
    # The suite starts Dovecot and Mailpit in Docker. The gate's container
    # has no Docker, so this job runs on the runner, which has it, and
    # builds only the crates the suite tests. None of them needs GTK.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # A pass here must mean the servers ran, not that the suite skipped
      # for want of Docker.
      PENGUIN_MAIL_REQUIRE_IMAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: scripts/ci-deps.sh --rust-only
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docker-suite
      # The tests never pull; this step fetches every pinned image once.
      - name: Pull the test images
        run: scripts/test-images.sh imap
      - name: The test servers
        run: cargo test -p mailrs-testmail --lib --test images --test servers --test pop3_profile --test radicale --test sieve_profile
      - name: The client against Dovecot and Mailpit
        run: cargo test -p mailrs-imap --test dovecot --test dovecot_untrusted
      # --nocapture keeps each profile's IDLE time in the log.
      - name: The adapter against Dovecot
        run: cargo test -p mailrs-sync --test dovecot -- --nocapture
      - name: CalDAV and CardDAV against Radicale
        run: cargo test -p mailrs-dav --test radicale && cargo test -p mailrs-sync --test radicale
      - name: ManageSieve against Dovecot
        run: cargo test -p mailrs-sieve --test dovecot && cargo test -p mailrs-sync --test managesieve
      - name: POP3 against Dovecot
        run: cargo test -p mailrs-pop3 --test dovecot && cargo test -p mailrs-sync --test pop3

  jmap:
    name: JMAP against real servers
    needs: changes
    if: needs.changes.outputs.jmap == 'true' || needs.changes.outputs.full == 'true'
    # Cyrus, Stalwart and Apache James in Docker. As with the IMAP job,
    # this runs on the runner, which has Docker, and builds only the
    # crates the suite tests.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      PENGUIN_MAIL_REQUIRE_JMAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: scripts/ci-deps.sh --rust-only
      - name: Put cargo on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: jmap-suite
      - name: Pull the test images
        run: scripts/test-images.sh jmap
      - name: The test servers
        run: cargo test -p mailrs-testmail --test jmap_servers
      - name: The client against the servers
        run: cargo test -p mailrs-jmap --test servers -- --nocapture
      # --nocapture keeps which servers pushed in the log.
      - name: The adapter against the servers
        run: cargo test -p mailrs-sync --test jmap -- --nocapture

  flatpak:
    name: Flatpak builds and starts
    needs: changes
    if: needs.changes.outputs.packaging == 'true' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Flathub's own image, with flatpak-builder and the GNOME 51 SDK the
    # manifest names. flatpak-builder needs the privileges to make its own
    # sandbox inside the container.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build runs offline from packaging/flatpak/cargo-sources.json, so
      # a Cargo.lock change without scripts/flatpak-sources.sh fails here.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: penguin-mail.flatpak
          manifest-path: packaging/flatpak/io.github.c9dev.penguin-mail.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
      # Starting the app with the manifest's permissions catches one it
      # needs and lacks before Flathub's reviewers or a user do. It starts
      # from the bundle the step above made, installed and run the way a
      # user runs it. `flatpak-builder --run` would need rofiles-fuse, which
      # this container cannot start, and it takes no option to skip it.
      - name: Start it
        run: |
          command -v Xvfb dbus-run-session || dnf install -y xorg-x11-server-Xvfb dbus-tools
          flatpak install --noninteractive -y --bundle penguin-mail.flatpak
          scripts/smoke-start.sh flatpak run io.github.c9dev.penguin-mail
