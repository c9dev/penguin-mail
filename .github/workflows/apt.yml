name: Package repositories

# Rebuilds the apt, dnf and Flatpak repositories on GitHub Pages from release
# assets. It runs after each tagged release, and by hand from the Actions tab
# to publish again without a new release.
#
# zizmor flags workflow_run because it runs with secrets after a workflow a
# pull request may have started. Here the trigger is Release, which only a
# pushed tag or a maintainer starts, and the build job also checks that the
# run came from a push. Nothing from the triggering run is checked out or
# read except release assets, which come from the published release.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  build:
    name: Build the repositories
    # A trial run of Release from the Actions tab publishes nothing, so it
    # has nothing to add here either.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the newest packages
        env:
          GH_TOKEN: ${{ github.token }}
        # The five newest releases: enough for a person to step back one
        # version with apt or dnf, and a site well inside Pages' size limit.
        # Releases from before the rpm have none, which is fine; a download
        # that fails stops the job.
        run: |
          set -euo pipefail
          mkdir debs rpms flatpaks
          tags=$(gh release list --exclude-drafts --exclude-pre-releases --limit 5 \
              --json tagName --jq '.[].tagName')
          flatpak_found=false
          for tag in $tags; do
              gh release download "$tag" --pattern '*.deb' --dir debs
              # The Debian 13 build cannot run on the Ubuntu this
              # repository serves, and its package says it updates by hand.
              rm -f debs/*~deb13_*.deb
              assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
              if grep -q '\.rpm$' <<<"$assets"; then
                  gh release download "$tag" --pattern '*.rpm' --dir rpms
              else
                  echo "$tag has no rpm"
              fi
              # Only the newest Flatpak belongs on the stable branch. A
              # fresh OSTree repository is made from it on each deploy.
              if [ "$flatpak_found" = false ] && grep -q '\.flatpak$' <<<"$assets"; then
                  gh release download "$tag" --pattern '*.flatpak' --dir flatpaks
                  flatpak_found=true
              fi
          done
          ls -l debs rpms flatpaks
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends createrepo-c flatpak ostree
      # Both steps name the keyring in their own env rather than through
      # GITHUB_ENV, which would hand it to every later step.
      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Build and sign
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          scripts/apt-repo.sh debs site
          if compgen -G 'rpms/*.rpm' >/dev/null; then
              scripts/rpm-repo.sh rpms site/rpm
          fi
          if compgen -G 'flatpaks/*.flatpak' >/dev/null; then
              scripts/flatpak-repo.sh flatpaks site/flatpak FE3C3B6E699AF939DC4670DCF3A853035C3E2B8E
          fi
          bytes=$(du -sb site | cut -f1)
          if [ "$bytes" -ge 1000000000 ]; then
              echo "::error::The Pages site is $bytes bytes; its published size must stay under 1 GB"
              exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish on Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publishes the site
      id-token: write # proves to Pages which workflow is deploying
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
