name: macOS package

on:
  workflow_call:
    inputs:
      # A JSON list of the architectures to build. Omitted, both build, which
      # is what the release workflow wants.
      arches:
        type: string
        default: '["arm64","x86_64"]'
    # A run without them still builds: without the clients the app cannot
    # sign in to Google or Microsoft, and without the Apple credentials the
    # zips are marked -unsigned. Pull requests run without any of them.
    secrets:
      PENGUIN_MAIL_GOOGLE_CLIENT_ID:
        required: false
      PENGUIN_MAIL_GOOGLE_CLIENT_SECRET:
        required: false
      MICROSOFT_CLIENT_ID:
        required: false
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    # Picked from the arch, not with matrix include: an include entry that
    # matches no arch in the list adds a job of its own.
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 90
    env:
      # Leave room for both debug checks and the release on hosted runners.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          brew install gtk4 libadwaita adwaita-icon-theme gettext librsvg pkgconf
          rust=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$rust" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$rust" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
      # A tagged release builds without the cache, as the Linux packages do:
      # another run wrote whatever it holds, and the zips go out signed.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          shared-key: macos-${{ matrix.arch }}
      - name: Check packaging and startup code
        run: |
          python3 scripts/test-macos-package.py
          cargo test -p mailrs --bin penguin-mail bundle::tests
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the app bundle
        env:
          PENGUIN_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_ID }}
          PENGUIN_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.PENGUIN_MAIL_GOOGLE_CLIENT_SECRET }}
          PENGUIN_MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          APP_DIR: ${{ github.workspace }}/dist
        run: |
          mkdir -p dist
          scripts/install-macos.sh
          python3 scripts/bundle-macos.py "dist/Penguin Mail.app"
      - name: Sign and pack the app
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/sign-macos.sh "dist/Penguin Mail.app" dist
      - name: Start the archived app without Homebrew
        run: python3 scripts/check-macos-bundle.py dist/*.zip
      - name: Read the version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penguin-mail-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
