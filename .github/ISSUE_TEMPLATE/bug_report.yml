name: Bug report
description: Penguin Mail did something wrong or crashed.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Leave out message content, addresses, and account names
        you would not post in public. A security problem goes to
        [a private advisory](https://github.com/c9dev/penguin-mail/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `penguin-mail --version`.
      placeholder: penguin-mail 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - The .deb from a release
        - The tarball or zip from a release
        - Built from source with scripts/install.sh
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and version, and the desktop you use.
      placeholder: Ubuntu 26.04, GNOME 50
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Start from something anyone can set up, such as "a fresh start with one account",
        then list what you did, one step per line. Name the buttons and keys you used.
      placeholder: |
        1. Start Penguin Mail with one Gmail account and the window closed
        2. Click the tray icon to open the window
        3. Open a conversation that has a PDF attachment
        4. Press Ctrl+S on the attachment
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often it happens
      options:
        - Every time I follow the steps
        - Sometimes
        - It happened once
    validations:
      required: true
  - type: dropdown
    id: demo
    attributes:
      label: Does it happen in the demo?
      description: |
        `penguin-mail --demo` opens sample accounts that never touch Gmail. If the bug shows
        there, anyone can reproduce it without your mail.
      options:
        - "Yes"
        - "No"
        - I did not try
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: The message that triggers it
      description: |
        If one message causes the bug (it renders wrong, will not open, breaks a reply),
        describe it: HTML or plain text, attachments, an invitation, encrypted or signed,
        the sending app if you know it. Better still, attach the raw message: in Gmail,
        More, Show original, Download original. Replace names, addresses and text with
        made-up ones before you attach it, and check it still triggers the bug.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Attach a screenshot if it shows the problem. Blur anything private first.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The app's lines from around the time it happened, from
        `journalctl --user --since "10 minutes ago" | grep -i penguin`.
        Read them before pasting: they can name accounts and subjects.
      render: text
  - type: checkboxes
    id: private
    attributes:
      label: Before you send
      options:
        - label: I removed message content, addresses and anything else private from this report.
          required: true
